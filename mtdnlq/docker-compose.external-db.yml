# MTD-NLQ — solo API en Docker; PostgreSQL/PostGIS en el servidor (MTD mtd10).
#
# Uso:
#   cp .env.docker.example .env
#   docker compose -f docker-compose.external-db.yml up -d --build

services:
  mtdnlq:
    build: .
    image: mtdnlq:${MTDNLQ_IMAGE_TAG:-latest}
    container_name: mtdnlq_api
    restart: unless-stopped
    ports:
      - "${MTDNLQ_HOST_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PYTHONPATH: /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
    command: >
      uvicorn mtdnlq.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level ${UVICORN_LOG_LEVEL:-info}
